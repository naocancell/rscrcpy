[package]
name = "rscrcpy-gui"
description = "Desktop GUI for rscrcpy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "rscrcpy"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
rscrcpy-core.workspace = true
eframe = "0.37.0"
png = "0.18.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
