[workspace]
resolver = "3"
members = ["crates/rscrcpy-core", "crates/rscrcpy-cli"]
default-members = ["crates/rscrcpy-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.104"
rscrcpy-core = { path = "crates/rscrcpy-core" }

[profile.release]
lto = "thin"
strip = true
