[workspace]
resolver = "3"
members = ["crates/rscrcpy-core", "crates/rscrcpy-cli", "crates/rscrcpy-gui"]
default-members = ["crates/rscrcpy-gui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
rscrcpy-core = { path = "crates/rscrcpy-core" }

# Optimize dependencies (OpenH264, egui) in debug builds too, otherwise `cargo run`
# decodes far too slowly and the video stutters.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
